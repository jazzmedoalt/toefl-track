name: Build portable app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file: TOEFL-Track.exe
          - os: ubuntu-22.04   # older glibc, so the binary runs on most distros
            file: TOEFL-Track
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 \
            libxcb-image0 libfontconfig1 libdbus-1-3

      - name: Build
        run: pyinstaller --noconfirm --clean toefl_track.spec

      - name: Smoke test (starts, creates its data file next to itself)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir smoke && cp "dist/${{ matrix.file }}" smoke/ && cd smoke
          "./${{ matrix.file }}" &
          pid=$!
          for i in $(seq 1 30); do [ -f toefl_data.db ] && break; sleep 1; done
          kill $pid 2>/dev/null || true
          taskkill //F //IM "${{ matrix.file }}" 2>/dev/null || true
          ls -la
          test -f toefl_data.db
          echo "OK: app started and created toefl_data.db"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: dist/${{ matrix.file }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/TOEFL-Track.exe/TOEFL-Track.exe
            out/TOEFL-Track/TOEFL-Track
