name: Build portable app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows portable .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller --noconfirm --clean toefl_track.spec

      - name: Smoke test (starts, creates its data file next to itself)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir smoke && cp dist/TOEFL-Track.exe smoke/ && cd smoke
          ./TOEFL-Track.exe &
          for i in $(seq 1 30); do [ -f toefl_data.db ] && break; sleep 1; done
          taskkill //F //IM TOEFL-Track.exe 2>/dev/null || true
          ls -la
          test -f toefl_data.db
          echo "OK: app started and created toefl_data.db"

      - uses: actions/upload-artifact@v4
        with:
          name: TOEFL-Track.exe
          path: dist/TOEFL-Track.exe

  linux:
    name: Linux AppImage
    runs-on: ubuntu-22.04   # older glibc, so the AppImage runs on most distros
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 \
            libxcb-image0 libfontconfig1 libdbus-1-3 appstream zsync desktop-file-utils

      - name: Build AppImage
        run: tools/build_appimage.sh

      - name: Smoke test AppImage
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"   # runners have no FUSE
        run: |
          mkdir smoke && cp dist/TOEFL-Track-x86_64.AppImage smoke/ && cd smoke
          ./TOEFL-Track-x86_64.AppImage &
          pid=$!
          for i in $(seq 1 30); do [ -f toefl_data.db ] && break; sleep 1; done
          kill $pid 2>/dev/null || true
          ls -la
          test -f toefl_data.db
          echo "OK: AppImage started and created toefl_data.db next to itself"
          test -f ../dist/TOEFL-Track-x86_64.AppImage.zsync

      - uses: actions/upload-artifact@v4
        with:
          name: TOEFL-Track-x86_64.AppImage
          path: |
            dist/TOEFL-Track-x86_64.AppImage
            dist/TOEFL-Track-x86_64.AppImage.zsync

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/TOEFL-Track.exe/TOEFL-Track.exe
            out/TOEFL-Track-x86_64.AppImage/TOEFL-Track-x86_64.AppImage
            out/TOEFL-Track-x86_64.AppImage/TOEFL-Track-x86_64.AppImage.zsync
